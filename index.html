<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Billy Sparks, KD4BEE">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dual Digital Clock | KD4BEE</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KD4BEE Clock">

    <!-- Amber Gold Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d1117'/><circle cx='50' cy='50' r='35' fill='none' stroke='%23d29922' stroke-width='6'/><path d='M50 25 V50 L65 65' stroke='%23d29922' stroke-width='6' stroke-linecap='round'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d1117'/><circle cx='50' cy='50' r='35' fill='none' stroke='%23d29922' stroke-width='6'/><path d='M50 25 V50 L65 65' stroke='%23d29922' stroke-width='6' stroke-linecap='round'/></svg>">

    <style>
        :root {
            --bg: #000000;
            --panel: #0d1117;
            --text-main: #e6edf3;
            --accent: #d29922;
            --success: #3fb950;
            --error: #f85149;
            --silver: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .am-pm {
            font-size: 0.45em;
            margin-left: 6px;
            vertical-align: middle;
            color: var(--accent);
            font-weight: 600;
        }

        .controls {
            background: var(--panel);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .fs-btn {
            background: #21262d;
            color: var(--silver);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .fs-btn:active {
            transform: scale(0.96);
            background: #30363d;
            color: var(--text-main);
        }

        .tz-select {
            background: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            max-width: 220px;
        }

        .toggle-label {
            font-size: 0.8rem;
            color: var(--silver);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .clocks-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            width: 100%;
            max-width: 1400px;
        }

        .clock-container {
            text-align: center;
            padding: 24px 15px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--panel);
            flex: 1;
            min-width: 280px;
            max-width: 600px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .clock-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .time {
            font-size: clamp(2.6rem, 11vw, 6.5rem); 
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: 700;
            margin: 8px 0;
            white-space: nowrap;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(210, 153, 34, 0.15);
        }

        #local-date, #utc-date {
            font-size: clamp(1.1rem, 3.5vw, 2.1rem);
            color: var(--silver);
            letter-spacing: 1px;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            font-size: clamp(0.85rem, 2vw, 1.05rem);
        }

        .log-panel {
            width: 100%;
            max-width: 1220px;
            background: var(--panel);
            border-radius: 16px;
            padding: 14px;
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .log-header {
            color: var(--silver);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .log-entry {
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.75rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 20px;
        }

        .switch input { display: none; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #21262d;
            transition: .4s;
            border-radius: 24px;
            border: 1px solid #30363d;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 2px;
            background-color: var(--silver);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); background-color: white; }

        .footer {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--silver);
            text-align: center;
            margin-top: 10px;
        }

        .callsign-link {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .controls { gap: 10px; padding: 10px 15px; }
            .clock-container { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="toggle-label">Zone:</span>
            <select id="timezoneSelect" class="tz-select" onchange="refreshDisplay()">
                <option value="local">Your Device Time</option>
                <option value="America/New_York" selected>Eastern Time (ET)</option>
                <option value="America/Chicago">Central Time (CT)</option>
                <option value="America/Denver">Mountain Time (MT)</option>
                <option value="America/Los_Angeles">Pacific Time (PT)</option>
                <option value="Europe/London">London (GMT/BST)</option>
                <option value="Europe/Paris">Paris (CET)</option>
                <option value="Asia/Tokyo">Tokyo (JST)</option>
                <option value="Australia/Sydney">Sydney (AEST)</option>
            </select>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="toggle-label">24H</span>
            <label class="switch">
                <input type="checkbox" id="formatToggle" onchange="refreshDisplay()" checked>
                <span class="slider"></span>
            </label>
            <span class="toggle-label">12H</span>
        </div>

        <button class="fs-btn" onclick="toggleFullscreen()">
            <span id="fs-icon">⛶</span> Fullscreen
        </button>
    </div>

    <div class="clocks-wrapper">
        <div class="clock-container">
            <div class="label" id="local-label">Selected Time</div>
            <div id="local-clock" class="time">--:--:--</div>
            <div id="local-date">-- --- ----</div>
        </div>

        <div class="clock-container">
            <div class="label">Universal Time (UTC)</div>
            <div id="utc-clock" class="time">--:--:--</div>
            <div id="utc-date">-- --- ----</div>
        </div>
    </div>

    <div class="log-panel">
        <div class="log-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>NETWORK TELEMETRY</span>
                <button class="fs-btn" style="padding: 2px 8px; font-size: 0.65rem;" onclick="syncClocks()">
                    🔄 Sync Now
                </button>
            </div>
            <span id="current-source" style="color: var(--success)">Source: Syncing...</span>
        </div>
        <div id="log-content"></div>
    </div>

    <div class="footer">
        Created by Billy Sparks, <a href="https://www.qrz.com/db/KD4BEE" target="_blank" class="callsign-link">KD4BEE</a>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registered successfully'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }

        let timeOffset = 0;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
                document.getElementById('fs-icon').innerText = "❌";
            } else {
                document.exitFullscreen();
                document.getElementById('fs-icon').innerText = "⛶";
            }
        }

        function addLogEntry(serverName, status, latency) {
            const logContent = document.getElementById('log-content');
            const timestamp = new Date().toLocaleTimeString();
            const entry = `<div class="log-entry"><span>[${timestamp}] Sync: <b style="color:var(--accent)">${serverName}</b></span><span>Lat: ${latency}ms <span style="background:#21262d; padding: 2px 6px; border-radius:4px; color:${status === "SUCCESS" ? "var(--success)" : "var(--error)"}">${status}</span></span></div>`;
            if (logContent) {
                logContent.innerHTML = entry + logContent.innerHTML;
                if (logContent.children.length > 2) logContent.removeChild(logContent.lastElementChild);
            }
        }

        async function syncClocks() {   
            document.getElementById('current-source').innerText = "Source: Syncing...";
            
            const APIS = [
                {
                    name: "Akamai CDN",
                    url: "https://time.akamai.com/?iso",
                    parse: async (response) => {
                        const text = await response.text();
                        return new Date(text.trim()).getTime();
                    }
                },
                {
                    name: "Cloudflare Edge",
                    url: "https://www.cloudflare.com/cdn-cgi/trace",
                    parse: async (response) => {
                        const text = await response.text();
                        const match = text.match(/^ts=(.+)$/m);
                        return match && match[1] ? Math.floor(parseFloat(match[1]) * 1000) : NaN;
                    }
                },
                {
                    name: "TimeAPI-IO",
                    url: "https://timeapi.io/api/v1/time/current/zone?timeZone=UTC",
                    parse: async (response) => {
                        const data = await response.json();
                        if (data && data.dateTime) {
                            const isoStr = data.dateTime.endsWith('Z') ? data.dateTime : data.dateTime + 'Z';
                            return new Date(isoStr).getTime();
                        }
                        return NaN;
                    }
                }
            ];

            for (const api of APIS) {
                const startTime = Date.now();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2500);

                    const cacheBuster = api.url.includes('?') ? '&' : '?';
                    const response = await fetch(`${api.url}${cacheBuster}_nocache=${startTime}`, {
                        signal: controller.signal,
                        cache: "no-store"
                    });
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error("HTTP Status " + response.status);

                    const serverTimeMs = await api.parse(response);
                    const endTime = Date.now();
                    const latency = Math.floor((endTime - startTime) / 2);

                    if (!isNaN(serverTimeMs) && serverTimeMs > 0) {
                        timeOffset = (serverTimeMs + latency) - endTime;
                        document.getElementById('current-source').innerText = `Source: ${api.name}`;
                        addLogEntry(api.name, "SUCCESS", latency);
                        refreshDisplay();
                        return;
                    }
                } catch (e) {
                    addLogEntry(api.name, "FAILED", "---");
                }
            }

            timeOffset = 0;
            document.getElementById('current-source').innerText = "Source: Device Clock";
            refreshDisplay();
        }

        function formatTimeWithSpan(timeStr) {
            return timeStr.replace(/\s*(AM|PM)/gi, ' <span class="am-pm">$1</span>');
        }

        function refreshDisplay() {
            const now = new Date(Date.now() + timeOffset);
            const is12Hour = document.getElementById('formatToggle').checked;
            const selectedZone = document.getElementById('timezoneSelect').value;
            
            const localOptions = {
                hour12: is12Hour, 
                hour: is12Hour ? 'numeric' : '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hourCycle: is12Hour ? 'h12' : 'h23'
            };
            
            if (selectedZone !== "local") localOptions.timeZone = selectedZone;

            const localString = now.toLocaleTimeString('en-US', localOptions);
            const utcString = now.toLocaleTimeString('en-US', {
                timeZone: 'UTC',
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hourCycle: 'h23'
            });

            const dateConfig = (tz) => {
                let cfg = { day: 'numeric', month: 'short', year: 'numeric' };
                if (tz !== "local") cfg.timeZone = tz;
                return cfg;
            };

            document.getElementById('local-clock').innerHTML = formatTimeWithSpan(localString);
            document.getElementById('utc-clock').innerHTML = utcString;
            document.getElementById('local-date').innerText = now.toLocaleDateString('en-US', dateConfig(selectedZone));
            document.getElementById('utc-date').innerText = now.toLocaleDateString('en-US', dateConfig('UTC'));
            
            const selectEl = document.getElementById('timezoneSelect');
            document.getElementById('local-label').innerText = selectEl.options[selectEl.selectedIndex].text;
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshDisplay();
            syncClocks();
            setInterval(refreshDisplay, 1000);
            setInterval(syncClocks, 300000);
        });
    </script>
</body>
</html>
