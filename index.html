<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Billy Sparks, KD4BEE">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Digital Clock | KD4BEE</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg: #000000;
            --panel: #000000;
            --text-main: #e6edf3;
            --accent: #58a6ff;
            --success: #3fb950;
            --error: #f85149;
            --silver: #8b949e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .am-pm {
            font-size: 0.4em;
            margin-left: 4px;
            vertical-align: middle;
        }

        .controls {
            margin-bottom: 20px;
            background: var(--panel);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: fit-content;
        }

        .fs-btn {
            background: #21262d;
            color: var(--silver);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .fs-btn:hover {
            background: #30363d;
            color: var(--text-main);
            border-color: var(--silver);
        }

        .tz-select {
            background: #21262d;
            color: var(--text-main);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .toggle-label {
            font-size: 0.8rem;
            color: var(--silver);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clocks-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1400px;
        }

        .clock-container {
            text-align: center;
            padding: 20px;
            border: 1px solid #30363d;
            border-radius: 12px;
            background: var(--panel);
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .time {
            font-size: clamp(2.5rem, 9vw, 6.5rem); 
            font-family: 'Arial', monospace;
            font-weight: bold;
            margin: 10px 0;
            white-space: nowrap;
        }

        #local-date, #utc-date {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            color: var(--silver);
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-size: clamp(0.8rem, 2vw, 1rem);
        }

        .log-panel {
            width: 100%;
            max-width: 1220px;
            background: #000;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            border: 1px solid #333;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .log-header {
            color: var(--silver);
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .log-entry {
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.75rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 20px;
        }

        .switch input { display: none; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #21262d;
            transition: .4s;
            border-radius: 24px;
            border: 1px solid #30363d;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 2px;
            background-color: var(--silver);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); background-color: white; }

        .footer {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--silver);
            text-align: center;
            margin-top: 10px;
        }

        .callsign-link {
            color: var(--accent);
            text-decoration: none;
        }

        /* Modal for Choosing Icon Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .icon-option {
            background: #21262d;
            border: 2px solid #30363d;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-main);
            font-size: 0.85rem;
        }
        .icon-option:hover { border-color: var(--accent); background: #30363d; }
        .icon-option svg { width: 64px; height: 64px; margin-bottom: 5px; display: block; margin-left: auto; margin-right: auto; }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .controls { gap: 10px; padding: 10px 15px; }
            .clock-container { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="toggle-label">Zone:</span>
            <select id="timezoneSelect" class="tz-select" onchange="refreshDisplay()">
                <option value="local">Your Device Time</option>
                <option value="America/New_York" selected>Eastern Time (ET)</option>
                <option value="America/Chicago">Central Time (CT)</option>
                <option value="America/Denver">Mountain Time (MT)</option>
                <option value="America/Los_Angeles">Pacific Time (PT)</option>
                <option value="Europe/London">London (GMT/BST)</option>
                <option value="Europe/Paris">Paris (CET)</option>
                <option value="Asia/Tokyo">Tokyo (JST)</option>
                <option value="Australia/Sydney">Sydney (AEST)</option>
            </select>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="toggle-label">24H</span>
            <label class="switch">
                <input type="checkbox" id="formatToggle" onchange="refreshDisplay()" checked>
                <span class="slider"></span>
            </label>
            <span class="toggle-label">12H</span>
        </div>

        <button class="fs-btn" onclick="openIconModal()">
            🎨 Icon Style
        </button>

        <button class="fs-btn" onclick="toggleFullscreen()">
            <span id="fs-icon">⛶</span> Fullscreen
        </button>
    </div>

    <div class="clocks-wrapper">
        <div class="clock-container">
            <div class="label" id="local-label">Selected Time</div>
            <div id="local-clock" class="time">--:--:--</div>
            <div id="local-date">-- --- ----</div>
        </div>

        <div class="clock-container">
            <div class="label">Universal Time (UTC)</div>
            <div id="utc-clock" class="time">--:--:--</div>
            <div id="utc-date">-- --- ----</div>
        </div>
    </div>

    <div class="log-panel">
        <div class="log-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>NETWORK TELEMETRY</span>
                <button class="fs-btn" style="padding: 2px 8px; font-size: 0.65rem;" onclick="syncClocks()">
                    🔄 Sync Now
                </button>
            </div>
            <span id="current-source" style="color: var(--success)">Source: Syncing...</span>
        </div>
        <div id="log-content"></div>
    </div>

    <div class="footer">
        Created by Billy Sparks, <a href="https://www.qrz.com/db/KD4BEE" target="_blank" class="callsign-link">KD4BEE</a>
    </div>

    <!-- Icon Picker Modal -->
    <div id="iconModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--accent);">Select Shortcut Icon</h3>
            <p style="font-size:0.8rem; color:var(--silver);">Choose your preferred icon style for your phone home screen shortcut.</p>
            <div class="icon-grid">
                <div class="icon-option" onclick="selectIconStyle('blue')">
                    <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#0d1117"/><circle cx="50" cy="50" r="35" fill="none" stroke="#58a6ff" stroke-width="6"/><path d="M50 25 V50 L65 65" stroke="#58a6ff" stroke-width="6" stroke-linecap="round"/></svg>
                    Classic Blue
                </div>
                <div class="icon-option" onclick="selectIconStyle('amber')">
                    <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#0d1117"/><circle cx="50" cy="50" r="35" fill="none" stroke="#d29922" stroke-width="6"/><path d="M50 25 V50 L65 65" stroke="#d29922" stroke-width="6" stroke-linecap="round"/></svg>
                    Amber Gold
                </div>
            </div>
            <button class="fs-btn" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="closeIconModal()">Close</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }

        function openIconModal() {
            document.getElementById('iconModal').style.display = 'flex';
        }
        function closeIconModal() {
            document.getElementById('iconModal').style.display = 'none';
        }
        function selectIconStyle(style) {
            alert(`Selected ${style} icon! Delete your current home screen shortcut and re-add it via Chrome to see the new icon.`);
            closeIconModal();
        }

        let timeOffset = 0;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message}`);
                });
                document.getElementById('fs-icon').innerText = "❌";
            } else {
                document.exitFullscreen();
                document.getElementById('fs-icon').innerText = "⛶";
            }
        }

        function addLogEntry(serverName, status, latency) {
            const logContent = document.getElementById('log-content');
            const timestamp = new Date().toLocaleTimeString();
            const entry = `<div class="log-entry"><span>[${timestamp}] Sync: <b style="color:var(--accent)">${serverName}</b></span><span>Lat: ${latency}ms <span class="status-tag" style="background:#21262d; padding: 2px 5px; border-radius:3px; color:${status === "SUCCESS" ? "var(--success)" : "var(--error)"}">${status}</span></span></div>`;
            if (logContent) {
                logContent.innerHTML = entry + logContent.innerHTML;
                if (logContent.children.length > 2) logContent.removeChild(logContent.lastElementChild);
            }
        }

        async function syncClocks() {   
            document.getElementById('current-source').innerText = "Source: Syncing...";
            const APIS = [
                {
                    name: "Akamai CDN",
                    url: "https://time.akamai.com/?iso",
                    parse: async (res) => new Date((await res.text()).trim()).getTime()
                },
                {
                    name: "Cloudflare Edge",
                    url: "https://www.cloudflare.com/cdn-cgi/trace",
                    parse: async (res) => {
                        const match = (await res.text()).match(/^ts=(.+)$/m);
                        return match ? Math.floor(parseFloat(match[1]) * 1000) : NaN;
                    }
                },
                {
                    name: "TimeAPI-IO",
                    url: "https://timeapi.io/api/v1/time/current/zone?timeZone=UTC",
                    parse: async (res) => {
                        const data = await res.json();
                        return data?.dateTime ? new Date(data.dateTime.endsWith('Z') ? data.dateTime : data.dateTime + 'Z').getTime() : NaN;
                    }
                }
            ];

            for (const api of APIS) {
                const startTime = Date.now();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2500);
                    const response = await fetch(`${api.url}&_nocache=${startTime}`, { signal: controller.signal, cache: "no-store" });
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error();
                    const serverTimeMs = await api.parse(response);
                    const latency = Math.floor((Date.now() - startTime) / 2);
                    if (!isNaN(serverTimeMs) && serverTimeMs > 0) {
                        timeOffset = (serverTimeMs + latency) - Date.now();
                        document.getElementById('current-source').innerText = `Source: ${api.name}`;
                        addLogEntry(api.name, "SUCCESS", latency);
                        refreshDisplay();
                        return;
                    }
                } catch (e) {
                    addLogEntry(api.name, "FAILED", "---");
                }
            }
            timeOffset = 0;
            document.getElementById('current-source').innerText = "Source: Device Clock";
            refreshDisplay();
        }

        function formatTimeWithSpan(timeStr) {
            return timeStr.replace(/\s*(AM|PM)/gi, ' <span class="am-pm">$1</span>');
        }

        function refreshDisplay() {
            const now = new Date(Date.now() + timeOffset);
            const is12Hour = document.getElementById('formatToggle').checked;
            const selectedZone = document.getElementById('timezoneSelect').value;
            
            const localOptions = {
                hour12: is12Hour, 
                hour: is12Hour ? 'numeric' : '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hourCycle: is12Hour ? 'h12' : 'h23'
            };
            if (selectedZone !== "local") localOptions.timeZone = selectedZone;

            const localString = now.toLocaleTimeString('en-US', localOptions);
            const utcString = now.toLocaleTimeString('en-US', { timeZone: 'UTC', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });

            const dateConfig = (tz) => {
                let cfg = { day: 'numeric', month: 'short', year: 'numeric' };
                if (tz !== "local") cfg.timeZone = tz;
                return cfg;
            };

            document.getElementById('local-clock').innerHTML = formatTimeWithSpan(localString);
            document.getElementById('utc-clock').innerHTML = utcString;
            document.getElementById('local-date').innerText = now.toLocaleDateString('en-US', dateConfig(selectedZone));
            document.getElementById('utc-date').innerText = now.toLocaleDateString('en-US', dateConfig('UTC'));
            
            const selectEl = document.getElementById('timezoneSelect');
            document.getElementById('local-label').innerText = selectEl.options[selectEl.selectedIndex].text;
        }

        refreshDisplay();
        syncClocks();
        setInterval(refreshDisplay, 1000);
        setInterval(syncClocks, 30000); 
    </script>
</body>
</html>
