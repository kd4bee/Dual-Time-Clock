<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="author" content="Billy Sparks, KD4BEE">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Digital Clock | KD4BEE</title>

    <!-- Mobile PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KD4BEE Clock">
    <meta name="theme-color" content="#000000">

    <!-- Embedded Amber Clock Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%23000000'/><circle cx='256' cy='256' r='180' fill='none' stroke='%23d29922' stroke-width='32'/><path d='M256 128 V256 L336 336' stroke='%23d29922' stroke-width='32' stroke-linecap='round'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%23000000'/><circle cx='256' cy='256' r='180' fill='none' stroke='%23d29922' stroke-width='32'/><path d='M256 128 V256 L336 336' stroke='%23d29922' stroke-width='32' stroke-linecap='round'/></svg>">

    <!-- Self-Generating PWA Web App Manifest -->
    <script>
        (function() {
            const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%23000000'/><circle cx='256' cy='256' r='180' fill='none' stroke='%23d29922' stroke-width='32'/><path d='M256 128 V256 L336 336' stroke='%23d29922' stroke-width='32' stroke-linecap='round'/></svg>`;
            const iconDataUrl = "data:image/svg+xml;utf8," + encodeURIComponent(iconSvg);

            const manifest = {
                "name": "KD4BEE Dual Digital Clock",
                "short_name": "KD4BEE Clock",
                "start_url": "./",
                "display": "standalone",
                "background_color": "#000000",
                "theme_color": "#000000",
                "icons": [
                    {
                        "src": iconDataUrl,
                        "sizes": "192x192 512x512",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    }
                ]
            };

            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestUrl = URL.createObjectURL(blob);
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);
        })();
    </script>

    <style>
        :root {
            --bg: #000000;
            --panel: #000000;
            --text-main: #e6edf3;
            --accent: #58a6ff;
            --success: #3fb950;
            --error: #f85149;
            --silver: #8b949e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- STYLING FOR AM/PM --- */
        .am-pm {
            font-size: 0.4em;
            margin-left: 4px;
            vertical-align: middle;
        }

        .controls {
            margin-bottom: 20px;
            background: var(--panel);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: fit-content;
        }

        .fs-btn {
            background: #21262d;
            color: var(--silver);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .fs-btn:hover {
            background: #30363d;
            color: var(--text-main);
            border-color: var(--silver);
        }

        .tz-select {
            background: #21262d;
            color: var(--text-main);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .toggle-label {
            font-size: 0.8rem;
            color: var(--silver);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clocks-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1400px;
        }

        .clock-container {
            text-align: center;
            padding: 20px;
            border: 1px solid #30363d;
            border-radius: 12px;
            background: var(--panel);
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .time {
            font-size: clamp(2.5rem, 9vw, 6.5rem); 
            font-family: 'Arial', monospace;
            font-weight: bold;
            margin: 10px 0;
            white-space: nowrap;
        }

        #local-date, #utc-date {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            color: var(--silver);
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-size: clamp(0.8rem, 2vw, 1rem);
        }

        .log-panel {
            width: 100%;
            max-width: 1220px;
            background: #000;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            border: 1px solid #333;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .log-header {
            color: var(--silver);
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .log-entry {
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.75rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 20px;
        }

        .switch input { display: none; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #21262d;
            transition: .4s;
            border-radius: 24px;
            border: 1px solid #30363d;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 2px;
            background-color: var(--silver);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); background-color: white; }

        .footer {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--silver);
            text-align: center;
            margin-top: 10px;
        }

        .callsign-link {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .controls { gap: 10px; padding: 10px 15px; }
            .clock-container { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="toggle-label">Zone:</span>
            <select id="timezoneSelect" class="tz-select" onchange="refreshDisplay()">
                <option value="local">Your Device Time</option>
                <option value="America/New_York" selected>Eastern Time (ET)</option>
                <option value="America/Chicago">Central Time (CT)</option>
                <option value="America/Denver">Mountain Time (MT)</option>
                <option value="America/Los_Angeles">Pacific Time (PT)</option>
                <option value="Europe/London">London (GMT/BST)</option>
                <option value="Europe/Paris">Paris (CET)</option>
                <option value="Asia/Tokyo">Tokyo (JST)</option>
                <option value="Australia/Sydney">Sydney (AEST)</option>
            </select>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="toggle-label">24H</span>
            <label class="switch">
                <input type="checkbox" id="formatToggle" onchange="refreshDisplay()" checked>
                <span class="slider"></span>
            </label>
            <span class="toggle-label">12H</span>
        </div>

        <button class="fs-btn" onclick="toggleFullscreen()">
            <span id="fs-icon">⛶</span> Fullscreen
        </button>
    </div>

    <div class="clocks-wrapper">
        <div class="clock-container">
            <div class="label" id="local-label">Selected Time</div>
            <div id="local-clock" class="time">--:--:--</div>
            <div id="local-date">-- --- ----</div>
        </div>

        <div class="clock-container">
            <div class="label">Universal Time (UTC)</div>
            <div id="utc-clock" class="time">--:--:--</div>
            <div id="utc-date">-- --- ----</div>
        </div>
    </div>

    <div class="log-panel">
        <div class="log-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>NETWORK TELEMETRY</span>
                <button class="fs-btn" style="padding: 2px 8px; font-size: 0.65rem;" onclick="syncClocks()">
                    🔄 Sync Now
                </button>
            </div>
            <span id="current-source" style="color: var(--success)">Source: Syncing...</span>
        </div>
        <div id="log-content"></div>
    </div>

    <div class="footer">
        Created by Billy Sparks, <a href="https://www.qrz.com/db/KD4BEE" target="_blank" class="callsign-link">KD4BEE</a>
    </div>

    <script>
        // Register Inline Service Worker from Blob URL
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl)
                .then(() => console.log('Single-file Service Worker active.'))
                .catch(err => console.log('Service worker notice: ', err));
        }

        // Store calculated offset in milliseconds between API time and client system clock
        let timeOffset = 0;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message}`);
                });
                document.getElementById('fs-icon').innerText = "❌";
            } else {
                document.exitFullscreen();
                document.getElementById('fs-icon').innerText = "⛶";
            }
        }

        function addLogEntry(serverName, status, latency) {
            const logContent = document.getElementById('log-content');
            const timestamp = new Date().toLocaleTimeString();
            const entry = `<div class="log-entry"><span>[${timestamp}] Sync: <b style="color:var(--accent)">${serverName}</b></span><span>Lat: ${latency}ms <span class="status-tag" style="background:#21262d; padding: 2px 5px; border-radius:3px; color:${status === "SUCCESS" ? "var(--success)" : "var(--error)"}">${status}</span></span></div>`;
            if (logContent) {
                logContent.innerHTML = entry + logContent.innerHTML;
                if (logContent.children.length > 2) logContent.removeChild(logContent.lastElementChild);
            }
        }

        async function syncClocks() {   
            document.getElementById('current-source').innerText = "Source: Syncing...";
            
            const APIS = [
                {
                    name: "Akamai CDN",
                    url: "https://time.akamai.com/?iso",
                    parse: async (response) => {
                        const text = await response.text();
                        const date = new Date(text.trim());
                        return date.getTime();
                    }
                },
                {
                    name: "Cloudflare Edge",
                    url: "https://www.cloudflare.com/cdn-cgi/trace",
                    parse: async (response) => {
                        const text = await response.text();
                        const match = text.match(/^ts=(.+)$/m);
                        if (match && match[1]) {
                            return Math.floor(parseFloat(match[1]) * 1000);
                        }
                        return NaN;
                    }
                },
                {
                    name: "TimeAPI-IO",
                    url: "https://timeapi.io/api/v1/time/current/zone?timeZone=UTC",
                    parse: async (response) => {
                        const data = await response.json();
                        if (data && data.dateTime) {
                            const isoStr = data.dateTime.endsWith('Z') ? data.dateTime : data.dateTime + 'Z';
                            return new Date(isoStr).getTime();
                        }
                        return NaN;
                    }
                },
                {
                    name: "WorldTimeAPI",
                    url: "https://worldtimeapi.org/api/timezone/Etc/UTC",
                    parse: async (response) => {
                        const data = await response.json();
                        if (data && data.datetime) return new Date(data.datetime).getTime();
                        if (data && data.unixtime) return data.unixtime * 1000;
                        return NaN;
                    }
                }
            ];

            for (const api of APIS) {
                const startTime = Date.now();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2500); // 2.5s connection timeout

                    const cacheBuster = api.url.includes('?') ? '&' : '?';
                    const response = await fetch(`${api.url}${cacheBuster}_nocache=${startTime}`, {
                        signal: controller.signal,
                        cache: "no-store"
                    });
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error("HTTP Status " + response.status);

                    const serverTimeMs = await api.parse(response);
                    const endTime = Date.now();
                    const latency = Math.floor((endTime - startTime) / 2);

                    if (!isNaN(serverTimeMs) && serverTimeMs > 0) {
                        timeOffset = (serverTimeMs + latency) - endTime;
                        document.getElementById('current-source').innerText = `Source: ${api.name}`;
                        addLogEntry(api.name, "SUCCESS", latency);
                        refreshDisplay();
                        return; // Successfully synced; exit loop
                    } else {
                        throw new Error("Invalid payload format");
                    }
                } catch (e) {
                    addLogEntry(api.name, "FAILED", "---");
                }
            }

            // Fallback: Default to client system clock if all network endpoints fail
            timeOffset = 0;
            document.getElementById('current-source').innerText = "Source: Device Clock";
            refreshDisplay();
        }

        function formatTimeWithSpan(timeStr) {
            return timeStr.replace(/\s*(AM|PM)/gi, ' <span class="am-pm">$1</span>');
        }

        function refreshDisplay() {
            const now = new Date(Date.now() + timeOffset);
            const is12Hour = document.getElementById('formatToggle').checked;
            const selectedZone = document.getElementById('timezoneSelect').value;
            
            const localOptions = {
                hour12: is12Hour, 
                hour: is12Hour ? 'numeric' : '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hourCycle: is12Hour ? 'h12' : 'h23'
            };
            
            if (selectedZone !== "local") {
                localOptions.timeZone = selectedZone;
            }

            const localString = now.toLocaleTimeString('en-US', localOptions);

            const utcString = now.toLocaleTimeString('en-US', {
                timeZone: 'UTC',
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hourCycle: 'h23'
            });

            const dateConfig = (tz) => {
                let cfg = { day: 'numeric', month: 'short', year: 'numeric' };
                if (tz !== "local") cfg.timeZone = tz;
                return cfg;
            };

            document.getElementById('local-clock').innerHTML = formatTimeWithSpan(localString);
            document.getElementById('utc-clock').innerHTML = utcString;
            document.getElementById('local-date').innerText = now.toLocaleDateString('en-US', dateConfig(selectedZone));
            document.getElementById('utc-date').innerText = now.toLocaleDateString('en-US', dateConfig('UTC'));
            
            const selectEl = document.getElementById('timezoneSelect');
            document.getElementById('local-label').innerText = selectEl.options[selectEl.selectedIndex].text;
        }

        // Run initial display update and network sync
        refreshDisplay();
        syncClocks();
        setInterval(refreshDisplay, 1000);
        setInterval(syncClocks, 30000); 
    </script>
</body>
</html>
